name: Deploy Laravel staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-laravel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Laravel to CloudPanel staging
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Laravel site
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.php
          test -f site/projects/artisan
          test -f site/projects/composer.lock
          test -d site/css
          test -d site/js
          test -d site/assets
          grep -q 'La Vida Belize' site/projects/resources/views/front/layouts/brad.blade.php
          grep -q 'usePublicPath' site/projects/bootstrap/app.php

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deployment host
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '31.170.165.106 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGOnV0w+MN94o87demmBNK8ee9fJD6Dc3OB6c7GIl5eQ' >> ~/.ssh/known_hosts

      - name: Ensure CloudPanel site user
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
          DEPLOY_APP_PATH: ${{ vars.DEPLOY_APP_PATH }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_APP_PATH"
          ssh -o StrictHostKeyChecking=yes "root@$DEPLOY_HOST" \
            "DEPLOY_USER='$DEPLOY_USER' DEPLOY_APP_PATH='$DEPLOY_APP_PATH' DEPLOY_DOMAIN='$DEPLOY_DOMAIN' bash -s" <<'REMOTE'
          set -euo pipefail
          SITE_USER="$DEPLOY_USER"
          DOMAIN="${DEPLOY_DOMAIN#https://}"
          DOMAIN="${DOMAIN#http://}"
          DOMAIN="${DOMAIN%/}"
          APP_PATH="$DEPLOY_APP_PATH"

          if [ ! -d "$APP_PATH" ]; then
            PASS="$(openssl rand -base64 24 | tr -d '/+=')Aa1!"
            clpctl site:add:static --domainName="$DOMAIN" --siteUser="$SITE_USER" --siteUserPassword="$PASS"
          fi

          test -d "$APP_PATH"

          install -d -m 700 "/home/${SITE_USER}/.ssh"
          touch "/home/${SITE_USER}/.ssh/authorized_keys"
          if [ -f /root/.ssh/authorized_keys ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              grep -qxF "$line" "/home/${SITE_USER}/.ssh/authorized_keys" || printf '%s\n' "$line" >> "/home/${SITE_USER}/.ssh/authorized_keys"
            done < /root/.ssh/authorized_keys
          fi
          chown -R "${SITE_USER}:${SITE_USER}" "/home/${SITE_USER}/.ssh"
          chmod 600 "/home/${SITE_USER}/.ssh/authorized_keys"
          REMOTE

      - name: Convert CloudPanel vhost to PHP and ensure MySQL
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
          DEPLOY_APP_PATH: ${{ vars.DEPLOY_APP_PATH }}
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=yes .github/scripts/cloudpanel-laravel-remote.sh \
            "root@$DEPLOY_HOST:/tmp/cloudpanel-laravel-remote.sh"
          ssh -o StrictHostKeyChecking=yes "root@$DEPLOY_HOST" \
            "chmod 700 /tmp/cloudpanel-laravel-remote.sh && DEPLOY_USER='$DEPLOY_USER' DEPLOY_APP_PATH='$DEPLOY_APP_PATH' DEPLOY_DOMAIN='$DEPLOY_DOMAIN' /tmp/cloudpanel-laravel-remote.sh prepare"

      - name: Deploy Laravel files
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ vars.DEPLOY_APP_PATH }}
        run: |
          set -euo pipefail
          rsync -rlz --delete --no-perms --omit-dir-times \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".env" \
            --exclude "projects/.env" \
            --exclude "vendor/" \
            --exclude "projects/vendor/" \
            --exclude "node_modules/" \
            --exclude "projects/node_modules/" \
            --exclude "uploads/" \
            --exclude "projects/storage/logs/" \
            --exclude "projects/storage/debugbar/" \
            --exclude "projects/storage/framework/cache/" \
            --exclude "projects/storage/framework/sessions/" \
            --exclude "projects/storage/framework/views/" \
            --exclude "projects/bootstrap/cache/*.php" \
            --exclude "front/assets/bootstrap-5.3.0/" \
            ./site/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_APP_PATH/"
          rsync -rlz --delete --no-perms --omit-dir-times \
            ./content/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_APP_PATH/content/"
          rsync -rlz --no-perms --omit-dir-times \
            ./database/master-clean.sql \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_APP_PATH/projects/database/master-clean.sql"

      - name: Write staging .env
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
          DEPLOY_APP_PATH: ${{ vars.DEPLOY_APP_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=yes "root@$DEPLOY_HOST" \
            "DEPLOY_USER='$DEPLOY_USER' DEPLOY_APP_PATH='$DEPLOY_APP_PATH' DEPLOY_DOMAIN='$DEPLOY_DOMAIN' /tmp/cloudpanel-laravel-remote.sh env"

      - name: Install Composer dependencies and boot Laravel
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ vars.DEPLOY_APP_PATH }}
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=yes .github/scripts/cloudpanel-laravel-boot.sh \
            "root@$DEPLOY_HOST:/tmp/cloudpanel-laravel-boot.sh"
          ssh -o StrictHostKeyChecking=yes "root@$DEPLOY_HOST" \
            "chmod 700 /tmp/cloudpanel-laravel-boot.sh && DEPLOY_USER='$DEPLOY_USER' DEPLOY_APP_PATH='$DEPLOY_APP_PATH' /tmp/cloudpanel-laravel-boot.sh"

      - name: Install Let's Encrypt certificate
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: |
          set -euo pipefail
          DOMAIN="${DEPLOY_DOMAIN#https://}"
          DOMAIN="${DOMAIN#http://}"
          DOMAIN="${DOMAIN%/}"
          if curl -fsS --max-time 20 "https://${DOMAIN}/" >/dev/null 2>&1; then
            echo "Trusted HTTPS already works"
            exit 0
          fi
          ssh -o StrictHostKeyChecking=yes "root@$DEPLOY_HOST" \
            "clpctl lets-encrypt:install:certificate --domainName='$DOMAIN'"

      - name: Verify public Laravel staging URL
        shell: bash
        env:
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: |
          set -euo pipefail
          DOMAIN="${DEPLOY_DOMAIN%/}"
          fetch() {
            local path="$1"
            local out="$2"
            curl -fsSL --max-time 30 "${DOMAIN}${path}" -o "$out"
            test -s "$out"
          }
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsSL --max-time 20 "${DOMAIN}/" -o /tmp/homepage.html \
              && curl -fsSL --max-time 20 "${DOMAIN}/properties" -o /tmp/properties.html; then
              break
            fi
            echo "Laravel routes not ready yet (attempt ${attempt}); waiting"
            sleep 5
          done
          test -s /tmp/homepage.html
          grep -q 'La Vida Belize' /tmp/homepage.html
          grep -q '/properties' /tmp/homepage.html
          if grep -q 'href="properties.html"' /tmp/homepage.html; then
            echo "Homepage still looks like the old static HTML tree" >&2
            exit 1
          fi
          test -s /tmp/properties.html
          grep -qi 'casa\|casita\|studio\|La Vida' /tmp/properties.html
          fetch /stay/la-vida-belize-casa /tmp/casa.html
          grep -qi 'La Vida' /tmp/casa.html
          fetch /login /tmp/login.html
          grep -qi 'login-email\|Sign in\|password' /tmp/login.html
          curl -fsSL --max-time 20 "${DOMAIN}/css/styles.css" -o /dev/null
          curl -fsSL --max-time 20 "${DOMAIN}/js/main.js" -o /dev/null
          curl -fsSL --max-time 20 "${DOMAIN}/vendor/adminlte/dist/css/adminlte.min.css" -o /tmp/adminlte.css
          grep -F '.dropdown-menu' /tmp/adminlte.css
          echo "Laravel staging checks passed"
