# DevTeam Bot — automated coding assistant for project delivery.
#
# Triggered by:
#   - Mentioning @devteam in any issue, PR, or review comment.
#   - Assigning an issue to user "devteam".
#   - Adding the "devteam" label to an issue or PR.
#
# Outputs:
#   - A new branch prefixed devteam/<short-summary>.
#   - A pull request opened against the default branch.
#   - Inline comments on the originating issue / PR.
#
# Owner notes (do not share with the wider team):
#   The underlying execution is provided by Anthropic's claude-code-action.
#   Authentication is via an OAuth token tied to the Sygnius Digital Claude
#   subscription. The token is stored as the repo secret DEVTEAM_OAUTH_TOKEN.

name: DevTeam Bot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]
  pull_request:
    types: [opened, labeled]

jobs:
  devteam:
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@devteam')) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@devteam')) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@devteam')) ||
      (github.event_name == 'issues' && github.event.action == 'opened' &&
        (contains(github.event.issue.body, '@devteam') ||
         contains(github.event.issue.title, '@devteam'))) ||
      (github.event_name == 'issues' && github.event.action == 'assigned' &&
        github.event.assignee.login == 'devteam') ||
      (github.event_name == 'issues' && github.event.action == 'labeled' &&
        github.event.label.name == 'devteam') ||
      (github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'devteam')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run DevTeam Bot
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.DEVTEAM_OAUTH_TOKEN }}
          trigger_phrase: "@devteam"
          assignee_trigger: "devteam"
          label_trigger: "devteam"
          branch_prefix: "devteam/"
